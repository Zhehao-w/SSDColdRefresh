name: Windows CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ColdRefresh.slnx
      - run: dotnet build ColdRefresh.slnx --configuration Release --no-restore
      - run: dotnet test ColdRefresh.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
